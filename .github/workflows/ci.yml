name: Build and release

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows_check:
    name: Check windows-x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure native Perl
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Native Windows Perl was not found at $perl"
          }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - run: ./scripts/dev.ps1 fmt --all '--' --check
      - run: ./scripts/dev.ps1 test --workspace --locked
      - run: ./scripts/dev.ps1 clippy --locked --workspace --all-targets '--' -D warnings
      - run: ./scripts/dev.ps1 build --locked

  linux_check:
    name: Check linux-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-unix

  macos_arm64_check:
    name: Check macos-arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-unix

  macos_x64_check:
    name: Check macos-x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-unix

  windows_package:
    name: Package windows-x64
    needs: windows_check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Configure native Perl
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Native Windows Perl was not found at $perl"
          }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - name: Build portable executable
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Package release
        shell: pwsh
        run: |
          $zip = 'GitViews-windows-x64.zip'
          Compress-Archive -Path dist/GitViews.exe, dist/GitViews.exe.sha256, dist/THIRD-PARTY-NOTICES.txt -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: |
            GitViews-windows-x64.zip
            GitViews-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  linux_package:
    name: Package linux-x64
    needs: linux_check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-unix
        with:
          platform: linux-x64
          target: x86_64-unknown-linux-gnu

  macos_arm64_package:
    name: Package macos-arm64
    needs: macos_arm64_check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-unix
        with:
          platform: macos-arm64
          target: aarch64-apple-darwin

  macos_x64_package:
    name: Package macos-x64
    needs: macos_x64_check
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-unix
        with:
          platform: macos-x64
          target: x86_64-apple-darwin

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows_package, linux_package, macos_arm64_package, macos_x64_package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist/release
          merge-multiple: true
      - name: Verify artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag $RELEASE_TAG does not match Cargo version $version" >&2; exit 1; }
          cd dist/release
          for archive in GitViews-windows-x64.zip GitViews-linux-x64.tar.gz GitViews-macos-arm64.tar.gz GitViews-macos-x64.tar.gz; do
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum --check "$archive.sha256"
          done
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes ./*
