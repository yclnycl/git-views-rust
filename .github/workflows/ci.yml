name: Build and release

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure native Perl
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Native Windows Perl was not found at $perl"
          }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - run: ./scripts/dev.ps1 fmt --all '--' --check
      - run: ./scripts/dev.ps1 test --workspace --locked
      - run: ./scripts/dev.ps1 clippy --locked --workspace --all-targets '--' -D warnings
      - run: ./scripts/dev.ps1 build --locked

  unix:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libfontconfig1-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check workspace with Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build native release
        run: cargo build --release --locked --package gitviews-app --bin gitviews
      - name: Collect third-party license information
        run: python3 scripts/collect-third-party-licenses.py '${{ matrix.target }}' dist/third-party-licenses
      - name: Preserve license inventory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: license-inventory-${{ matrix.platform }}
          path: dist/third-party-licenses/inventory.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/package-macos.sh "${PACKAGE_PLATFORM#macos-}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/GitViews-*.tar.gz
            dist/GitViews-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  windows_package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Configure native Perl
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Native Windows Perl was not found at $perl"
          }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - name: Build portable executable
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Package release
        shell: pwsh
        run: |
          $zip = 'GitViews-windows-x64.zip'
          Compress-Archive -Path dist/GitViews.exe, dist/GitViews.exe.sha256, dist/THIRD-PARTY-NOTICES.txt -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: |
            GitViews-windows-x64.zip
            GitViews-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows_package, unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist/release
          merge-multiple: true
      - name: Verify artifacts and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag $RELEASE_TAG does not match Cargo version $version" >&2; exit 1; }
          cd dist/release
          for archive in GitViews-windows-x64.zip GitViews-linux-x64.tar.gz GitViews-macos-arm64.tar.gz GitViews-macos-x64.tar.gz; do
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum --check "$archive.sha256"
          done
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes ./*
