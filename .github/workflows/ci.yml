name: Rust

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure native Perl
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Native Windows Perl was not found at $perl"
          }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - run: ./scripts/dev.ps1 fmt --all '--' --check
      - run: ./scripts/dev.ps1 test --workspace --locked
      - run: ./scripts/dev.ps1 clippy --locked --workspace --all-targets '--' -D warnings
      - run: ./scripts/dev.ps1 build --locked

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Configure native Perl
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Native Windows Perl was not found at $perl"
          }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - name: Build portable executable
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Package release
        shell: pwsh
        run: |
          $zip = 'GitViews-windows-x64.zip'
          Compress-Archive -Path dist/GitViews.exe, dist/GitViews.exe.sha256, dist/THIRD-PARTY-NOTICES.txt -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n", [Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG GitViews-windows-x64.zip GitViews-windows-x64.zip.sha256 --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Creating the GitHub Release failed with exit code $LASTEXITCODE." }
